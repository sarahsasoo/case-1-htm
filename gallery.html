<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galleri</title>
</head>
<body>

    <nav>
        <a href="index.html">Om mig</a>
        <a href="stockholm.html">Stockholm</a>
        <a href="event.html">Evenemang</a>
        <a href="gallery.html">Galleri</a>
    </nav>

    <header>
        <p>Välkommen till min webbplats!</p>
    </header>

    <main>
        <h1>Galleri</h1>

        <h2>Bilder</h2>

        <figure>
            <img src="images/stockholm" alt="Stockholm" width="400">
            <figcaption>Stockholm och dess vackra miljö.</figcaption>
        </figure>

        <figure>
            <img src="images/natur.jpg" alt="Natur i Sverige" width="400">
            <figcaption>Natur i Sverige.</figcaption>
        </figure>

        <h2>Musik</h2>

        <audio controls>
            <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">
            Din webbläsare stödjer inte ljud.
        </audio>

        <h2>Video</h2>

        <video controls width="400">
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            Din webbläsare stödjer inte video.
        </video>

        <h2>Karta</h2>

        <iframe
            src="https://www.google.com/maps?q=Stockholm,Sweden&output=embed"
            width="400"
            height="300"
            title="Karta över Stockholm">
        </iframe>

        <p>
            Läs mer om Stockholm på
            <a href="https://www.visitstockholm.com/" target="_blank">
                Visit Stockholm
            </a>
        </p>

    </main>

    <footer>
        <p>GitHub: sarahsasoo</p>
    </footer>

</body>
</html>
